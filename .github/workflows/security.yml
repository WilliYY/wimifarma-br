name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install browser for isolated UI regression tests
        run: npx playwright install --with-deps chromium

      - name: All regression tests (including security, Miauby and checkout)
        run: npm run test:all

      - name: Block high and critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Block critical dependency vulnerabilities
        run: npm audit --audit-level=critical
